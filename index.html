<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>Modern Bedroom Character Studio</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171720;color:#fff;font-family:Inter,system-ui,sans-serif}canvas{display:block;touch-action:none}
    #loading{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:linear-gradient(145deg,#171720,#292537);transition:.45s opacity}.loadcard{text-align:center;width:min(78vw,380px)}.track{height:5px;background:#ffffff1c;border-radius:9px;overflow:hidden;margin-top:16px}.bar{height:100%;width:8%;background:#d7ad82;transition:.2s}
    #ui{position:fixed;inset:0;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}.brand{align-self:flex-start;background:#15131acc;border:1px solid #ffffff1a;border-radius:14px;padding:11px 14px;backdrop-filter:blur(16px)}.brand b{display:block;font-size:14px}.brand span{font-size:11px;color:#c8c3ce}
    .panel{pointer-events:auto;align-self:center;display:flex;gap:7px;max-width:100%;overflow:auto;padding:8px;background:#15131ad9;border:1px solid #ffffff1a;border-radius:18px;backdrop-filter:blur(18px);scrollbar-width:none}.panel::-webkit-scrollbar{display:none}button{border:0;background:#ffffff12;color:#ddd;border-radius:11px;padding:10px 13px;white-space:nowrap;font:600 12px inherit}button.active{background:#d7ad82;color:#241d19}button:active{transform:scale(.97)}
    #hint{position:fixed;right:14px;top:14px;background:#15131acc;border:1px solid #ffffff1a;border-radius:12px;padding:9px 11px;font-size:11px;color:#c8c3ce;backdrop-filter:blur(14px)}
    @media(max-width:600px){#hint{top:auto;bottom:90px}.brand{padding:9px 11px}.panel{align-self:stretch}button{padding:10px 12px}}
  </style>
</head>
<body>
  <div id="loading"><div class="loadcard"><b>Preparing bedroom</b><div id="status">Loading character…</div><div class="track"><div class="bar" id="bar"></div></div></div></div>
  <div id="ui"><div class="brand"><b>Bedroom Character Studio</b><span>Stylised real-time scene</span></div><div class="panel" id="motions"></div></div>
  <div id="hint">Drag to look · Pinch / scroll to zoom</div>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
